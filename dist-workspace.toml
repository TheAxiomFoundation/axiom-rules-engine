# Config for dist 0.31.0.
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Checksums to generate for each App
checksum = "sha256"
# Whether to enable GitHub Attestations
github-attestations = true
# release.yml carries hand edits that cargo-dist can't express in config: the
# security hardening (tag-injection fix, per-job least-privilege permissions,
# SHA-pinned actions, checksum-verified installer, offline locked builds) and the
# concurrency block that cancels a pull request's older run. allow-dirty stops
# dist from checking or regenerating release.yml, so those edits survive
# `dist init`. Before you remove it to regenerate the file, read the list at the
# top of release.yml, and re-apply every edit on it by hand afterwards.
allow-dirty = ["ci"]

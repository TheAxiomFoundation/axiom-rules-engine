# Config for dist 0.31.0.
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Checksums to generate for each App
checksum = "sha256"
# Whether to enable GitHub Attestations
github-attestations = true
# build-python-wheels.yml builds the Python wheels (the dense extension for
# CPython 3.13 and 3.14 on Linux x86_64, and the wrapper) that the release
# attaches beside the CLI archives. release.yml calls it as
# custom-build-python-wheels. Its attest job needs the OIDC token to attest
# the wheels, as the build jobs attest the archives.
global-artifacts-jobs = ["./build-python-wheels"]
github-custom-job-permissions = { "build-python-wheels" = { attestations = "write", contents = "read", id-token = "write" } }
# release.yml carries hand edits that regenerating it would drop: the security
# patches and the concurrency block that release.yml lists at its top.
# allow-dirty stops dist from checking or regenerating release.yml, so those
# edits survive `dist init`. Before you remove it to regenerate the file, read
# that list, and re-apply every edit on it by hand afterwards.
allow-dirty = ["ci"]

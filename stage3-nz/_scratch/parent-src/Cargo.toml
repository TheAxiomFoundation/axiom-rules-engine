[package]
name = "axiom-rules-engine"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Temporal-relational runtime for compiling and executing Axiom RuleSpec (experimental API)."
repository = "https://github.com/TheAxiomFoundation/axiom-rules-engine"
keywords = ["rules-engine", "rules-as-code", "legal", "policy", "rulespec"]
# The published crate carries the library, CLI, and format docs only. Tests,
# fixtures, and the Python wrapper stay repo-only. Generated schemas also stay
# out (they regenerate via `emit-schemas`) with one exception: the `schema`
# feature's src/schema.rs include_str!s compiled-artifact.v1.schema.json, so
# that file must ship or all-features builds (docs.rs included) cannot compile.
include = [
    "src/**",
    "docs/**",
    "schemas/compiled-artifact.v1.schema.json",
    "README.md",
    "LICENSE",
]

# docs.rs builds default features only unless told otherwise; build the full
# surface (fs + schema) so the hosted API docs show everything.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["fs"]
# Filesystem-backed module resolution (CanonicalRuleSpecRoots, FsModuleSource,
# the *_file loading and artifact APIs) and the CLI binary. With this feature
# off, the core has no std::fs / std::env usage and
# checks cleanly for wasm32-unknown-unknown; hosts supply modules through
# source::ModuleSource.
fs = []
# JSON Schema generation for the serialized RuleSpec/artifact surface
# (`schema` module, the `emit-schemas` CLI subcommand, and the golden/
# conformance/fidelity tests). Pulls in `schemars`, which is std-only, so it
# is kept OFF the default build to keep pure-runtime consumers (the PyO3
# extension, wasm, finbot, microsim) lean. CI runs the schema tests with
# `--features schema`; `cargo test --features schema` reproduces them locally.
schema = ["dep:schemars"]
# Stage-2 prototype for the ratified unit-derivation semantics. The runtime
# configuration inside the module is independently disabled by default. This
# feature does not extend artifact v2 or any publication/launch surface.
unit-derivation = []

[[bin]]
name = "axiom-rules-engine"
path = "src/main.rs"
required-features = ["fs"]

[dependencies]
# Default features off: the `clock` feature (wall-clock reads) stays out of
# the core, which never reads the current time and must not on wasm hosts.
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
rust_decimal = { version = "1.39.0", features = ["maths", "serde"] }
rust_decimal_macros = "1.39.0"
schemars = { version = "1", features = ["chrono04", "rust_decimal1"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.17"

[dev-dependencies]
jsonschema = "0.46"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that pull request's older run of this
# workflow, so runs for superseded heads stop holding runners. Each push to
# main keys its own group, so nothing cancels it or makes it wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo build
        run: cargo build --verbose

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # The evaluator modules deny clippy::arithmetic_side_effects, so an
      # unchecked Decimal or chrono operator (both panic on overflow) fails
      # this step. No other clippy lint is enforced.
      - name: cargo clippy (evaluator arithmetic guard)
        run: cargo clippy --lib --no-deps --verbose -- -A clippy::all

      - name: explicit RuleSpec root adversarial tests
        run: >-
          cargo test
          --test exclusive_root_resolution
          --test composed_compile
          --verbose

      - name: cargo test
        run: cargo test --verbose

      # Schema generation lives behind the non-default `schema` feature so
      # pure-runtime consumers stay lean. These tests regenerate the published
      # JSON Schemas and assert the checked-in `schemas/` copies are current
      # (golden-file drift guard), check schema/serde fidelity, and — when a
      # rulespec-us checkout is present — validate the corpus. The conformance
      # test self-skips here, where no checkout exists.
      - name: cargo test (schema feature)
        run: cargo test --features schema --verbose

      # The unit-derivation prototype (stage 2, src/unit_derivation) and its
      # stage-3 aggregation layer sit behind the non-default `unit-derivation`
      # feature, and so do their tests: the module's unit tests, the exact NZ
      # result fixture in tests/unit_aggregation_cli.rs, and the four
      # experimental stage-3 schemas that `schemas_are_current` checks. Without
      # this run, a failure in any of them reaches main unnoticed.
      - name: cargo test (schema + unit-derivation features)
        run: cargo test --features "schema unit-derivation" --verbose

      - name: cargo build --release
        run: cargo build --release --verbose

      # The PyO3 extension is a separate crate that this job's other cargo
      # commands never compile; a core enum change once broke it silently
      # (the DenseColumn::Float arm). Type-check it on every run. The `python`
      # job builds and links it on Linux with `maturin develop`, and
      # `python-ext-linux-wheel` builds its wheel. `cargo check` never links,
      # so the macOS extension-module link is guarded separately by the
      # `python-ext-macos` job below.
      - name: cargo check (python-ext)
        run: cargo check --manifest-path python-ext/Cargo.toml --verbose

  rust-macos:
    name: Rust build + tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo build
        run: cargo build --verbose

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: explicit RuleSpec root adversarial tests
        run: >-
          cargo test
          --test exclusive_root_resolution
          --test composed_compile
          --verbose

      - name: cargo test
        run: cargo test --verbose

      - name: cargo test (schema feature)
        run: cargo test --features schema --verbose

      - name: cargo test (schema + unit-derivation features)
        run: cargo test --features "schema unit-derivation" --verbose

      - name: cargo build --release
        run: cargo build --release --verbose

      - name: cargo check (python-ext)
        run: cargo check --manifest-path python-ext/Cargo.toml --verbose

  python-ext-macos:
    name: PyO3 extension build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: python-ext

      # Guards issue #92. The `extension-module` cdylib leaves the Python
      # C-API symbols undefined at link time; on macOS the linker rejects them
      # unless it gets `-undefined dynamic_lookup`, which python-ext/build.rs
      # emits (pyo3 0.27 no longer auto-emits them). Unlike the Linux
      # `cargo check` above, `cargo build` actually links the cdylib, so a
      # regression in that link setup fails CI here instead of only surfacing
      # in a developer's local `cargo build` / `maturin develop`.
      - name: cargo build (python-ext extension-module cdylib)
        run: cargo build --manifest-path python-ext/Cargo.toml --verbose

  wasm:
    name: wasm32 core check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo check (wasm32-unknown-unknown, no default features)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --verbose

  wasm-pkg:
    name: wasm bindings package + node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: wasm

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: wasm-pack build (nodejs)
        run: wasm-pack build wasm --target nodejs --out-dir pkg-node

      - name: wasm-pack build (web)
        run: wasm-pack build wasm --target web --out-dir pkg-web

      - name: Node smoke test
        run: node wasm/test/smoke.mjs

      - name: Selected-year input WASM regression
        run: node wasm/test/selected-year-input.mjs

  python:
    name: Python package tests
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # Hypothesis runs the property tests, which skip without it.
      - name: Create Python environment and install package
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -e python/
          uv pip install --python .venv/bin/python pytest hypothesis==6.170.14 maturin==1.14.1

      - name: Build and install native dense extension
        run: .venv/bin/maturin develop --manifest-path python-ext/Cargo.toml

      - name: Verify native dense extension import
        run: .venv/bin/python -c "import axiom_rules_engine_dense"

      # The end-to-end tests run target/debug/axiom-rules-engine. They skip
      # without it locally, but under CI a missing binary fails them.
      - name: Build the engine binary for the end-to-end tests
        run: cargo build --bin axiom-rules-engine

      - name: Run Python tests
        run: .venv/bin/python -m pytest -q python/tests

  # Builds the dense extension as a CPython 3.14 wheel, installs it with the
  # wrapper from python/, runs the Python tests against the installed packages,
  # and uploads the wheel under a name that carries the commit sha. It runs on
  # every push to main and every pull request, so each main commit whose job
  # passes carries a wheel built from it, for the repository's artifact
  # retention period. maturin builds on the runner and tags the wheel with the
  # oldest manylinux policy its glibc symbols allow: manylinux_2_34, the same
  # glibc floor as the CLI binary the `cli-linux` job builds. Both jobs name
  # ubuntu-24.04 rather than ubuntu-latest, which GitHub is moving to a newer
  # image, so that floor does not change from one commit to the next.
  python-ext-linux-wheel:
    name: PyO3 extension wheel (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            python-ext
            .

      - name: Build the wheel
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python maturin==1.14.1
          .venv/bin/maturin build --release --locked \
            --manifest-path python-ext/Cargo.toml \
            --interpreter .venv/bin/python --out dist

      # Hypothesis runs the property tests, which skip without it.
      - name: Install the wheel with the Python wrapper
        run: >-
          uv pip install --python .venv/bin/python
          ./python dist/axiom_rules_engine_dense-*.whl pytest hypothesis==6.170.14

      # The tests below must exercise the installed packages, not the checkout.
      - name: Check both packages import from site-packages
        run: |
          .venv/bin/python - <<'PY'
          import sysconfig
          from pathlib import Path

          import axiom_rules_engine
          import axiom_rules_engine_dense

          site_packages = Path(sysconfig.get_path("platlib")).resolve()
          for module in (axiom_rules_engine, axiom_rules_engine_dense):
              path = Path(module.__file__).resolve()
              print(module.__name__, path)
              assert path.is_relative_to(site_packages), path
          PY

      # The end-to-end tests compile and run programs with
      # target/debug/axiom-rules-engine, as in the python job. Among them,
      # CompiledDenseProgram.from_artifact_file loads the artifacts it writes.
      - name: Build the engine binary for the end-to-end tests
        run: cargo build --locked --bin axiom-rules-engine

      - name: Run the Python tests against the installed wheel
        run: .venv/bin/python -m pytest -q python/tests

      - name: Upload the wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: axiom-rules-engine-dense-wheel-cp314-linux-x86_64-${{ github.sha }}
          path: dist/axiom_rules_engine_dense-*.whl
          if-no-files-found: error

  # Builds the axiom-rules-engine CLI, which the Python wrapper runs through
  # subprocess to compile and run programs, smoke-tests it and uploads it under
  # a name that carries the same commit sha as the wheel's, so a consumer can
  # take the wheel and the CLI from one build.
  cli-linux:
    name: CLI release binary (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo build --release --locked
        run: cargo build --release --locked --verbose

      - name: Smoke test (compile --help)
        run: target/release/axiom-rules-engine compile --help

      # build.rs stamps the commit into every artifact the binary compiles
      # (`engine_build`), so it must be the commit the artifact name carries.
      - name: Check the binary's build identity
        run: |
          target/release/axiom-rules-engine capabilities | tee capabilities.json
          jq -e --arg sha "$GITHUB_SHA" '.engine_build == {commit: $sha, dirty: false}' capabilities.json

      - name: Upload the CLI binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: axiom-rules-engine-cli-linux-x86_64-${{ github.sha }}
          path: target/release/axiom-rules-engine
          if-no-files-found: error
